[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "facets-wrapper"
version = "0.1.0"
description = "Config-driven FastAPI wrapper over Facets REST services, generated from an Excel mapping sheet"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "httpx>=0.27",
  "pydantic>=2.5",
  "PyYAML>=6.0",
  "openpyxl>=3.1",
  "jsonpath-ng>=1.6",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
facets-wrapper = "facets_wrapper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
